databases:
  - name: tree-map-db
    plan: free
    databaseName: tree_map
    user: tree_map

services:
  - type: web
    name: tree-map
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tree-map-db
          property: connectionString
